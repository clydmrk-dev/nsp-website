name: NSP Typography Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-typography:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply typography only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          font_link = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">\n'
          if 'Cormorant+Garamond' not in s:
              s = s.replace('</head>', font_link + '</head>', 1)

          # Remove the malformed visible CSS comment created by the previous update.
          s = s.replace('\n/* NSP TYPOGRAPHY — Cormorant Garamond + Inter */\n<style id="nsp-typography">', '\n<style id="nsp-typography">')

          override = '''\n<style id="nsp-typography">\nbody { font-family: 'Inter', Arial, Helvetica, sans-serif; }\nh1, h2, h3, .hero h1, .section-title, .collection h2, .statement-text, .about h2, .social h2, .modal-title { font-family: 'Cormorant Garamond', Georgia, serif; }\n.logo, .nav-links, .bag-button, .eyebrow, .hero-copy, .button, .marquee, .label, .text-link, .product-name, .product-price, .product-cta, .collection-number, .collection-copy p, .outline-button, .reference, .about-copy, .footer-column, .footer-bottom, .modal-label, .modal-price, .modal-description, .size-title, .size-stock, .size, .add-button { font-family: 'Inter', Arial, Helvetica, sans-serif; }\n.hero h1 { font-weight: 600; letter-spacing: -.055em; }\n.section-title, .collection h2, .statement-text, .about h2, .social h2, .modal-title { font-weight: 600; }\n</style>\n'''
          if 'id="nsp-typography"' not in s:
              s = s.replace('</head>', override + '</head>', 1)

          p.write_text(s)
          PY
      - name: Commit typography update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix NSP typography markup'
          git push