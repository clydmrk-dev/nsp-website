name: Connect NSP checkout to order management

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect checkout to order API
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if "fetch('/api/orders'" in html:
              print("Checkout is already connected.")
              raise SystemExit(0)

          submit_target = """document
            .getElementById('checkoutForm')
            .addEventListener(
              'submit',
              e => {"""

          submit_replacement = """document
            .getElementById('checkoutForm')
            .addEventListener(
              'submit',
              async e => {"""

          if submit_target not in html:
              raise SystemExit("Could not find the checkout submit handler.")

          html = html.replace(submit_target, submit_replacement, 1)

          needle = """      showSuccess(
        orderNumber,
        customer,
        total,
        orderText
      );"""

          insertion = """      try {
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            orderNumber,
            customer,
            items: [...bag],
            total
          })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok || !result.ok) {
          throw new Error(result.error || 'Unable to save the order.');
        }
      } catch (error) {
        console.error('NSP order submission error:', error);
        alert('We could not save your order right now. Please try again.');
        return;
      }


""" + needle

          if needle not in html:
              raise SystemExit("Could not find the order success transition.")

          html = html.replace(needle, insertion, 1)
          path.write_text(html, encoding="utf-8")
          print("Checkout connection added successfully.")
      
      - name: Commit checkout connection
        run: |
          if git diff --quiet -- index.html; then
            echo "No checkout changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect checkout to order API"
          git push
