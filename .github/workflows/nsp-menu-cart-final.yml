name: NSP menu cart final patch
on:
  push:
    branches: [main]
    paths:
      - scripts/nsp_menu_cart_final.py
      - .github/workflows/nsp-menu-cart-final.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/nsp_menu_cart_final.py
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine NSP menu and cart scrolling" || exit 0
          git push
