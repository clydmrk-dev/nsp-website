name: Center NSP hero title

on:
  push:
    paths:
      - '.github/workflows/center-hero-title.yml'

permissions:
  contents: write

jobs:
  center-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Center only the hero title
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''.hero h1{\n  position:relative;\n  z-index:2;\n  width:100%;\n  text-align:center;\n  white-space:nowrap;\n  font-size:clamp(38px,8vw,125px);\n  line-height:.82;\n  letter-spacing:-.055em;\n  font-weight:600;\n  text-transform:uppercase;\n}'''

          new = '''.hero h1{\n  position:relative;\n  z-index:2;\n  width:100%;\n  text-align:center;\n  white-space:nowrap;\n  font-size:clamp(38px,8vw,125px);\n  line-height:.82;\n  letter-spacing:-.055em;\n  font-weight:600;\n  text-transform:uppercase;\n  transform:translateY(calc(-50vh + 139px + 4vw));\n}'''

          if old not in text:
              raise SystemExit('Expected hero h1 CSS block was not found; no changes made.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit the targeted change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Center NSP hero title'
          git push