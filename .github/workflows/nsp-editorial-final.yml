name: NSP editorial storefront final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply NSP editorial storefront direction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='NSP EDITORIAL STOREFRONT FINAL'
          if marker in s:
              raise SystemExit('already applied')
          css=r'''
          /* NSP EDITORIAL STOREFRONT FINAL */
          body{background:#f1f0eb;}
          .navbar{height:76px;padding:0 4.5%;mix-blend-mode:difference;}
          .logo{min-width:180px;width:180px;height:28px;}
          .logo img{width:180px;height:28px;object-fit:contain;object-position:left center;}
          .nav-links{gap:28px;font-size:10px;letter-spacing:1.8px;}
          .bag-button{font-size:10px;letter-spacing:1.8px;}
          .hero{min-height:100svh;padding:110px 4.5% 34px;justify-content:flex-end;}
          .hero:before{width:min(58vw,760px);border-color:rgba(255,255,255,.08);}
          .hero:after{right:4.5%;top:105px;letter-spacing:3px;}
          .eyebrow{font-size:9px;letter-spacing:3.5px;margin-bottom:15px;}
          .hero-logo{width:min(72vw,900px);margin-left:0;}
          .hero-logo img{max-height:44vh;}
          .hero-bottom{margin-top:30px;padding-top:20px;border-top:1px solid rgba(255,255,255,.18);}
          .hero-copy{font-size:12px;line-height:1.6;max-width:360px;}
          .button{min-height:44px;padding:0 23px;font-size:9px;letter-spacing:1.8px;}
          .marquee{padding:12px 0;}
          .marquee span{font-size:9px;letter-spacing:3px;margin-right:42px;}
          .section{padding:115px 4.5%;}
          .section-head{margin-bottom:42px;}
          .label{font-size:9px;letter-spacing:2.5px;}
          .section-title{font-size:clamp(42px,6vw,82px);}
          .text-link{font-size:9px;letter-spacing:1.8px;}
          .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:62px 20px;}
          .product-image{aspect-ratio:4/5;background:#e5e3dd;padding:28px;}
          .product-info{padding-top:13px;}
          .product-name,.product-price{font-size:9px;letter-spacing:1.1px;}
          .product-cta{margin-top:10px;padding:11px;font-size:8px;letter-spacing:1.5px;}
          .collection{grid-template-columns:1fr 1fr;}
          .collection-copy{padding:100px 8%;}
          .collection-number{font-size:9px;letter-spacing:3px;}
          .collection h2{font-size:clamp(80px,11vw,165px);margin-bottom:30px;}
          .collection-copy p{font-size:12px;line-height:1.65;max-width:330px;}
          .collection-image{min-height:680px;padding:42px;}
          .statement{padding:140px 5%;}
          .statement-text{font-size:clamp(34px,5vw,70px);}
          .reference{font-size:9px;letter-spacing:2.5px;}
          .about{gap:80px;}
          .about-copy p{font-size:15px;line-height:1.75;}
          .social{padding:130px 5%;}
          .social p{font-size:12px;}
          footer{padding:50px 4.5% 24px;}
          .footer-logo{font-size:48px;}
          .footer-links{gap:55px;}
          @media(max-width:800px){
            .navbar{height:68px;padding:0 5%;}
            .logo{min-width:125px;width:125px;height:25px;}
            .logo img{width:125px;height:25px;}
            .hero{padding:95px 5% 28px;}
            .hero-logo{width:92vw;}
            .hero-logo img{max-height:40vh;}
            .hero-bottom{margin-top:24px;display:block;}
            .hero-copy{margin-bottom:20px;max-width:300px;}
            .section{padding:82px 5%;}
            .products{grid-template-columns:1fr;gap:45px;}
            .collection{grid-template-columns:1fr;}
            .collection-image{min-height:500px;}
            .about{grid-template-columns:1fr;gap:40px;}
            .footer-top{display:block;}
            .footer-links{margin-top:40px;gap:30px;}
          }
          '''
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/nsp-editorial-final.yml
          git add index.html .github/workflows/nsp-editorial-final.yml
          git commit -m "Push NSP storefront toward editorial fashion direction"
          git push
