name: Adjust NSP Hero

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adjust hero sizing and CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          s = s.replace('font-size:clamp(70px,13.8vw,205px);', 'font-size:clamp(54px,9.5vw,145px);')
          s = s.replace('line-height:.76;', 'line-height:.82;', 1)
          s = s.replace('margin-top:58px;', 'margin-top:34px;', 1)
          s = s.replace('max-width:390px;\n  color:rgba(255,255,255,.64);', 'max-width:420px;\n  color:rgba(255,255,255,.64);', 1)

          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refine NSP hero layout'
          git push
