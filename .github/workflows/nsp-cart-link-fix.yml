name: NSP cart link fix
on:
  push:
    paths:
      - '.github/nsp-cart-link-trigger.txt'
permissions:
  contents: write
jobs:
  fix-cart-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make bag icon open cart landing page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='NSP CART LANDING LINK 2026-09-02'
          if marker in s:
              raise SystemExit('already patched')
          patch='''\n<style id="nsp-cart-landing-link-style">/* NSP CART LANDING LINK 2026-09-02 */</style>\n<script id="nsp-cart-landing-link">\n(function(){\n  function bind(){\n    const bag=document.getElementById('bagButton');\n    if(!bag || bag.dataset.nspCartLanding==='1') return;\n    bag.dataset.nspCartLanding='1';\n    bag.onclick=function(e){\n      e.preventDefault();\n      e.stopImmediatePropagation();\n      window.location.href='/cart';\n    };\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bind);\n  else bind();\n})();\n</script>\n'''
          s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Open cart icon as dedicated landing page"
          git push
