name: NSP product gallery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update product modal gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
          /* PRODUCT GALLERY */
          .modal-gallery{
            background:var(--soft);
            min-height:500px;
            padding:28px;
            display:flex;
            flex-direction:column;
            gap:14px;
          }
          .modal-gallery-main{
            position:relative;
            flex:1;
            min-height:420px;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
          }
          .modal-gallery-main img{
            width:100%;
            height:100%;
            max-height:620px;
            object-fit:contain;
            transition:opacity .18s ease, transform .25s ease;
          }
          .gallery-arrow{
            position:absolute;
            top:50%;
            transform:translateY(-50%);
            width:42px;
            height:42px;
            border:1px solid rgba(10,10,10,.22);
            border-radius:50%;
            background:rgba(244,241,232,.92);
            color:var(--black);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            z-index:2;
            transition:.2s;
          }
          .gallery-arrow:hover:not(:disabled){
            background:var(--forest);
            color:var(--cream);
            border-color:var(--forest);
          }
          .gallery-arrow:disabled{
            opacity:.28;
            cursor:not-allowed;
          }
          .gallery-prev{left:10px}
          .gallery-next{right:10px}
          .gallery-counter{
            position:absolute;
            left:50%;
            bottom:12px;
            transform:translateX(-50%);
            padding:6px 10px;
            background:rgba(10,10,10,.72);
            color:var(--cream);
            font:700 9px/1 Inter,Arial,sans-serif;
            letter-spacing:1px;
          }
          .gallery-thumbs{
            display:flex;
            gap:8px;
            overflow-x:auto;
            padding-bottom:2px;
          }
          .gallery-thumb{
            flex:0 0 64px;
            width:64px;
            height:72px;
            padding:5px;
            border:1px solid rgba(10,10,10,.16);
            background:var(--cream);
            opacity:.55;
            transition:.2s;
          }
          .gallery-thumb img{width:100%;height:100%;object-fit:contain}
          .gallery-thumb.active,
          .gallery-thumb:hover{opacity:1;border-color:var(--forest)}
          @media(max-width:800px){
            .modal-gallery{min-height:350px;padding:18px}
            .modal-gallery-main{min-height:300px}
          }
          '''

          marker = '/* BAG */'
          if '/* PRODUCT GALLERY */' not in s:
              s = s.replace(marker, css + '\n' + marker, 1)

          old_modal = '''    <div class="modal-image"><img id="modalImage" src="" alt=""></div>'''
          new_modal = '''    <div class="modal-gallery">
      <div class="modal-gallery-main">
        <button class="gallery-arrow gallery-prev" id="galleryPrev" aria-label="Previous product photo">‹</button>
        <img id="modalImage" src="" alt="">
        <button class="gallery-arrow gallery-next" id="galleryNext" aria-label="Next product photo">›</button>
        <div class="gallery-counter" id="galleryCounter">1 / 1</div>
      </div>
      <div class="gallery-thumbs" id="galleryThumbs"></div>
    </div>'''
          if old_modal in s:
              s = s.replace(old_modal, new_modal, 1)

          old_products = '''const products = [
  {name:'NSP Collection 01',price:490,image:'/2.png'},
  {name:'NSP Collection 02',price:490,image:'/3.png'},
  {name:'NSP Collection 03',price:490,image:'/4.png'},
  {name:'NSP Collection 04',price:490,image:'/5.png'},
  {name:'NSP Collection 05',price:490,image:'/6.png'},
  {name:'NSP Collection 06',price:490,image:'/7.png'}
];'''
          new_products = '''const products = [
  {name:'NSP Collection 01',price:490,image:'/2.png',gallery:['/2.png']},
  {name:'NSP Collection 02',price:490,image:'/3.png',gallery:['/3.png']},
  {name:'NSP Collection 03',price:490,image:'/4.png',gallery:['/4.png']},
  {name:'NSP Collection 04',price:490,image:'/5.png',gallery:['/5.png']},
  {name:'NSP Collection 05',price:490,image:'/6.png',gallery:['/6.png']},
  {name:'NSP Collection 06',price:490,image:'/7.png',gallery:['/7.png']}
];'''
          if old_products in s:
              s = s.replace(old_products, new_products, 1)

          old_state = '''let selectedProduct = null;
let selectedSize = '';
let inventory = {};'''
          new_state = '''let selectedProduct = null;
let selectedSize = '';
let galleryIndex = 0;
let inventory = {};'''
          s = s.replace(old_state, new_state, 1)

          old_open = '''function openProduct(i){
  selectedProduct = products[i];
  selectedSize = '';
  modalImage.src = selectedProduct.image;
  modalImage.alt = selectedProduct.name;
  modalTitle.textContent = selectedProduct.name;
  modalPrice.textContent = `₱${selectedProduct.price}`;
  sizes.querySelectorAll('.size').forEach(b => b.classList.remove('selected'));
  if(sizeStock) sizeStock.textContent = '';
  updateSizeAvailability();
  modal.classList.add('open');
  loadInventory();
}'''
          new_open = '''function getProductGallery(product){
  return Array.isArray(product?.gallery) && product.gallery.length ? product.gallery : [product?.image].filter(Boolean);
}

function renderGallery(){
  const gallery = getProductGallery(selectedProduct);
  if(galleryIndex >= gallery.length) galleryIndex = 0;
  modalImage.style.opacity = '0';
  window.setTimeout(() => {
    modalImage.src = gallery[galleryIndex];
    modalImage.alt = `${selectedProduct.name} — photo ${galleryIndex + 1}`;
    modalImage.style.opacity = '1';
  }, 80);
  const counter = document.getElementById('galleryCounter');
  if(counter) counter.textContent = `${galleryIndex + 1} / ${gallery.length}`;
  const prev = document.getElementById('galleryPrev');
  const next = document.getElementById('galleryNext');
  if(prev) prev.disabled = gallery.length <= 1;
  if(next) next.disabled = gallery.length <= 1;
  const thumbs = document.getElementById('galleryThumbs');
  if(thumbs){
    thumbs.innerHTML = gallery.map((src,i)=>`<button class="gallery-thumb ${i===galleryIndex?'active':''}" data-gallery-index="${i}" aria-label="View photo ${i+1}"><img src="${src}" alt=""></button>`).join('');
    thumbs.querySelectorAll('.gallery-thumb').forEach(button=>{
      button.onclick=()=>{ galleryIndex=Number(button.dataset.galleryIndex); renderGallery(); };
    });
  }
}

function openProduct(i){
  selectedProduct = products[i];
  selectedSize = '';
  galleryIndex = 0;
  modalTitle.textContent = selectedProduct.name;
  modalPrice.textContent = `₱${selectedProduct.price}`;
  sizes.querySelectorAll('.size').forEach(b => b.classList.remove('selected'));
  if(sizeStock) sizeStock.textContent = '';
  renderGallery();
  updateSizeAvailability();
  modal.classList.add('open');
  loadInventory();
}'''
          if old_open in s:
              s = s.replace(old_open, new_open, 1)

          anchor = '''productsEl.addEventListener('click',e=>{
  const card = e.target.closest('.product');
  if(card) openProduct(Number(card.dataset.index));
});'''
          gallery_handlers = '''productsEl.addEventListener('click',e=>{
  const card = e.target.closest('.product');
  if(card) openProduct(Number(card.dataset.index));
});

document.getElementById('galleryPrev').onclick=()=>{
  const gallery=getProductGallery(selectedProduct);
  if(gallery.length<=1) return;
  galleryIndex=(galleryIndex-1+gallery.length)%gallery.length;
  renderGallery();
};

document.getElementById('galleryNext').onclick=()=>{
  const gallery=getProductGallery(selectedProduct);
  if(gallery.length<=1) return;
  galleryIndex=(galleryIndex+1)%gallery.length;
  renderGallery();
};'''
          if 'document.getElementById(''galleryNext'')' not in s:
              s = s.replace(anchor, gallery_handlers, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nsp-product-gallery.yml
          git add index.html
          git diff --cached --check
          git diff --cached --quiet || git commit -m "Add NSP product detail gallery"
          git push