name: NSP product gallery migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gallery
        run: python scripts/apply_product_gallery.py
      - name: Commit gallery and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_product_gallery.py .github/workflows/nsp-product-gallery.yml
          git add index.html
          git diff --cached --check
          git commit -m "Add NSP product detail gallery"
          git push
