name: Update NSP hero logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace hero text with NSP logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''  <h1>None<br>Shall<br>Perish</h1>'''
          new = '''  <h1 class="hero-logo"><img src="/logonsp.png" alt="None Shall Perish"></h1>'''
          if old not in s:
              raise SystemExit('Expected hero markup was not found.')
          s = s.replace(old, new, 1)
          marker = '.hero h1{\n'
          css = '''.hero-logo{\n  position:relative;\n  z-index:2;\n  width:min(78vw,820px);\n  margin-left:-2%;\n  display:flex;\n  align-items:center;\n  justify-content:flex-start;\n}\n.hero-logo img{\n  width:100%;\n  max-height:48vh;\n  object-fit:contain;\n  object-position:left center;\n  filter:brightness(0) invert(1);\n}\n'''
          if '.hero-logo{' not in s:
              s = s.replace(marker, css + marker, 1)
          mobile = '''  .hero-logo{width:min(92vw,620px);margin-left:-1%;}\n  .hero-logo img{max-height:38vh;}\n'''
          media_marker = '  .hero h1{font-size:clamp(63px,18vw,130px)}\n'
          if '  .hero-logo{width:min(92vw,620px)' not in s:
              s = s.replace(media_marker, media_marker + mobile, 1)
          p.write_text(s)
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-hero-logo.yml
          git add index.html .github/workflows/update-hero-logo.yml
          git diff --cached --quiet || git commit -m "Replace hero text with white NSP logo"
          git push
