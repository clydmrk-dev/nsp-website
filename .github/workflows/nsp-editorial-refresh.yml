name: NSP final hero fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix hero title and eyebrow only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''

/* NSP HERO FINAL POSITIONING — title and eyebrow only */
.hero h1{
  position:absolute !important;
  z-index:2 !important;
  top:50% !important;
  left:50% !important;
  width:90% !important;
  margin:0 !important;
  text-align:center !important;
  white-space:nowrap !important;
  transform:translate(-50%,-50%) !important;
}
.eyebrow{
  position:absolute !important;
  z-index:2 !important;
  top:calc(50% - 92px) !important;
  left:50% !important;
  width:100% !important;
  margin:0 !important;
  text-align:center !important;
  transform:translateX(-50%) !important;
}
@media(max-width:800px){
  .hero h1{
    width:96% !important;
    font-size:clamp(30px,10vw,80px) !important;
  }
  .eyebrow{
    top:calc(50% - 58px) !important;
    font-size:9px !important;
  }
}
'''

          marker = '/* NSP HERO FINAL POSITIONING — title and eyebrow only */'
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Hero fix already present.')
          PY

      - name: Remove auto-modifying workflows
        run: |
          rm -f .github/workflows/nsp-editorial-refresh.yml
          rm -f .github/workflows/patch-orders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix NSP hero center alignment and disable auto patches"
          git push
