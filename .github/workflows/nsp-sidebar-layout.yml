name: NSP sidebar layout
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested sidebar layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '/* NSP SIDEBAR LAYOUT V2 */'
          if marker not in s:
              css = r'''
<style id="nsp-sidebar-layout-v2">
/* NSP SIDEBAR LAYOUT V2 */
.navbar .nav-links{
  position:fixed!important;
  top:0!important;
  left:calc(-1 * var(--nsp-side-shift, 320px))!important;
  width:var(--nsp-side-shift, 320px)!important;
  height:100vh!important;
  margin:0!important;
  padding:32px!important;
  box-sizing:border-box!important;
  display:flex!important;
  flex-direction:column!important;
  justify-content:center!important;
  align-items:flex-start!important;
  gap:22px!important;
  overflow:hidden!important;
  overscroll-behavior:none!important;
  touch-action:none!important;
  background:#fff!important;
  color:var(--black)!important;
  transform:none!important;
  z-index:3000!important;
}
.navbar .nav-links.active{left:calc(-1 * var(--nsp-side-shift, 320px))!important;transform:none!important;}
.navbar .nav-links a{color:var(--black)!important;}
.navbar .nav-links .nsp-menu-close{position:absolute!important;top:24px!important;right:24px!important;width:36px!important;height:36px!important;margin:0!important;}
body.nsp-cart-open #bagButton,body.nsp-cart-open .bag-button{opacity:0!important;visibility:hidden!important;pointer-events:none!important;}
.menu-btn{width:44px!important;height:44px!important;padding:6px 0!important;gap:6px!important;}
.menu-btn span{width:34px!important;height:2px!important;}
.bag-button{width:44px!important;height:44px!important;}
.bag-button::before{font-size:24px!important;}
@media(max-width:800px){.navbar .nav-links{width:min(320px,78vw)!important;left:calc(-1 * min(320px,78vw))!important}.navbar .nav-links.active{left:calc(-1 * min(320px,78vw))!important}}
</style>
'''
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s)
          PY
      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply NSP sidebar layout and cart icon fix"
          git push
