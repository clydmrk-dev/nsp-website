name: NSP Sidebar Push
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update sidebar push behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '/* NSP SIDEBAR PUSH BEHAVIOR */'
          css = r'''\n/* NSP SIDEBAR PUSH BEHAVIOR */\n:root{--nsp-side-shift:320px;}\nbody{--nsp-page-shift:0px;}\nbody.nsp-menu-open{--nsp-page-shift:var(--nsp-side-shift);}\nbody.nsp-cart-open{--nsp-page-shift:calc(var(--nsp-side-shift) * -1);}\n.navbar, body > *:not(.navbar){transition:transform .45s cubic-bezier(.22,.61,.36,1);}\n.navbar{transform:translateX(var(--nsp-page-shift));}\nbody > *:not(.navbar){transform:translateX(var(--nsp-page-shift));}\n.nav-links{position:fixed!important;top:0!important;left:0!important;width:var(--nsp-side-shift)!important;height:100vh!important;overflow:hidden!important;}\n.cart-panel,.bag-panel,#bagPanel{height:100vh;overflow-y:auto;}\n'''
          if marker not in s:
              s=s.replace('</style>', css+'\n</style>', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Push NSP page with sidebars" || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nsp-sidebar-push.yml
          git commit -m "Remove temporary NSP sidebar workflow"
          git push
