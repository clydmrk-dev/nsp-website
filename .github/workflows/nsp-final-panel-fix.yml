name: NSP final panel behavior fix
on:
  push:
    paths:
      - '.github/nsp-final-panel-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='NSP PANEL TRUE SPLIT 2026-09-02'
          if marker not in s:
            css='''<style id="nsp-panel-true-split">
/* NSP PANEL TRUE SPLIT 2026-09-02 */
:root{--nsp-menu-width:25vw;--nsp-cart-width:39vw;--nsp-panel-ease:cubic-bezier(.22,.61,.36,1);}
html,body{width:100%;max-width:100%;overflow-x:hidden;}
body.nsp-menu-open,body.nsp-cart-open{padding:0!important;margin:0!important;}
body.nsp-menu-open>main,body.nsp-menu-open>footer{transform:translate3d(var(--nsp-menu-width),0,0)!important;width:100%!important;transition:transform .45s var(--nsp-panel-ease)!important;}
body.nsp-cart-open>main,body.nsp-cart-open>footer{transform:translate3d(calc(-1 * var(--nsp-cart-width)),0,0)!important;width:100%!important;transition:transform .45s var(--nsp-panel-ease)!important;}
body.nsp-menu-open>.navbar{transform:translate3d(var(--nsp-menu-width),0,0)!important;transition:transform .45s var(--nsp-panel-ease)!important;}
body.nsp-cart-open>.navbar{transform:translate3d(calc(-1 * var(--nsp-cart-width)),0,0)!important;transition:transform .45s var(--nsp-panel-ease)!important;}
.navbar .nav-links.active{display:flex!important;position:absolute!important;top:0!important;left:calc(-1 * var(--nsp-menu-width))!important;width:var(--nsp-menu-width)!important;min-width:var(--nsp-menu-width)!important;max-width:var(--nsp-menu-width)!important;height:100vh!important;padding:52px 44px!important;margin:0!important;background:#fff!important;color:#0A0A0A!important;overflow:hidden!important;z-index:2001!important;transform:none!important;box-shadow:none!important;mix-blend-mode:normal!important;}
body.nsp-menu-open>.navbar .nav-links.active{left:calc(-1 * var(--nsp-menu-width))!important;transform:none!important;}
body.nsp-menu-open{overflow:hidden!important;}
body.nsp-cart-open .bag-panel{position:fixed!important;top:0!important;right:0!important;left:auto!important;width:var(--nsp-cart-width)!important;max-width:var(--nsp-cart-width)!important;height:100vh!important;transform:none!important;z-index:2001!important;overflow-y:auto!important;transition:transform .45s var(--nsp-panel-ease),right .45s var(--nsp-panel-ease)!important;}
body.nsp-cart-open{overflow:auto!important;}
body.nsp-menu-open .modal-backdrop,body.nsp-cart-open .modal-backdrop,body.nsp-menu-open .checkout-backdrop,body.nsp-cart-open .checkout-backdrop{transform:none!important;}
@media(max-width:800px){:root{--nsp-menu-width:78vw;--nsp-cart-width:88vw;}.navbar .nav-links.active{width:var(--nsp-menu-width)!important;min-width:var(--nsp-menu-width)!important;max-width:var(--nsp-menu-width)!important;padding:48px 32px!important;}}
</style>'''
            s=s.replace('</head>',css+'\n</head>',1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix NSP true split drawer layout"
          git push
