name: NSP final panel behavior fix
on:
  push:
    paths:
      - '.github/nsp-final-panel-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='NSP PANEL BLANK SPACE FIX 2026-09-02'
          if marker not in s:
            css='''<style id="nsp-panel-blank-space-fix">
/* NSP PANEL BLANK SPACE FIX 2026-09-02 */
/* Do not shrink the page when a drawer opens. The drawer occupies the space
   created by translating the full-width page, matching the reference layout. */
:root{
  --nsp-menu-width:25vw;
  --nsp-cart-width:min(430px,40vw);
  --nsp-panel-ease:cubic-bezier(.22,.61,.36,1);
}
/* Undo the earlier padding-based push; padding was shrinking the document and
   was the source of the large blank regions shown beside the page. */
body.nsp-menu-open,
body.nsp-cart-open{
  padding-left:0!important;
  padding-right:0!important;
}
/* Only the actual page shell moves. Fixed drawers/modals stay in place. */
body.nsp-menu-open>main,
body.nsp-menu-open>footer,
body.nsp-menu-open>.navbar{
  transform:translateX(var(--nsp-menu-width))!important;
  transition:transform .45s var(--nsp-panel-ease)!important;
}
body.nsp-cart-open>main,
body.nsp-cart-open>footer,
body.nsp-cart-open>.navbar{
  transform:translateX(calc(-1 * var(--nsp-cart-width)))!important;
  transition:transform .45s var(--nsp-panel-ease)!important;
}
/* Never transform the fixed cart, menu, checkout, or product modal. */
body.nsp-menu-open>.nav-links,
body.nsp-cart-open>.nav-links,
body.nsp-menu-open>.bag-panel,
body.nsp-cart-open>.bag-panel,
body.nsp-menu-open>.modal-backdrop,
body.nsp-cart-open>.modal-backdrop,
body.nsp-menu-open>.checkout-backdrop,
body.nsp-cart-open>.checkout-backdrop{
  transform:none!important;
}
/* Menu is exactly the left quarter on desktop, like the reference. */
.nav-links.nsp-reference-menu,
.nav-links.active{
  width:25vw!important;
  min-width:0!important;
  max-width:none!important;
  left:0!important;
  right:auto!important;
  padding:52px 44px!important;
  background:#fff!important;
  color:#0A0A0A!important;
}
/* Cart fills the right-side space it creates, with no empty area after it. */
.bag-panel{
  width:var(--nsp-cart-width)!important;
  right:calc(-1 * var(--nsp-cart-width))!important;
  transition:right .45s var(--nsp-panel-ease)!important;
}
.bag-panel.open{right:0!important;}
/* Cart remains independently scrollable; only the menu locks the document. */
body.nsp-menu-open{overflow:hidden!important;}
body.nsp-cart-open{overflow:auto!important;}
@media(max-width:800px){
  :root{--nsp-menu-width:78vw;--nsp-cart-width:88vw;}
  .nav-links.nsp-reference-menu,
  .nav-links.active{width:var(--nsp-menu-width)!important;padding:48px 32px!important;}
}
</style>'''
            s=s.replace('</head>',css+'\n</head>',1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix NSP panel blank space layout"
          git push
