name: NSP Store UI V2
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-nsp-store-ui-v2.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace(''' .logo{\n  font-size:25px;\n  font-weight:900;\n  letter-spacing:-.08em;\n}'''.lstrip(), '''.logo{display:none;}''', 1)

          old='''.menu-btn,\n.bag-button{\n  border:0;\n  background:none;\n  color:var(--cream);\n}\n.menu-btn{\n  display:none;\n  font-size:25px;\n}\n.bag-button{\n  font-size:11px;\n  font-weight:800;\n  letter-spacing:1.5px;\n  text-transform:uppercase;\n}\n.bag-count{\n  display:inline-flex;\n  min-width:18px;\n  height:18px;\n  margin-left:5px;\n  border-radius:50%;\n  align-items:center;\n  justify-content:center;\n  background:var(--cream);\n  color:var(--black);\n  font-size:9px;\n}'''
          new='''.menu-btn,.bag-button{border:0;background:none;color:var(--cream);}\n.menu-btn{display:flex;flex-direction:column;justify-content:center;gap:5px;width:34px;height:34px;padding:5px 0;}\n.menu-btn span{display:block;width:28px;height:2px;background:currentColor;}\n.bag-button{font-size:0;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;position:relative;}\n.bag-button::before{content:"\\1F6D2";font-size:18px;line-height:1;}\n.bag-count{position:absolute;top:0;right:-2px;display:inline-flex;min-width:15px;height:15px;margin:0;border-radius:50%;align-items:center;justify-content:center;background:var(--cream);color:var(--black);font-size:8px;}'''
          if old not in s: raise SystemExit('nav CSS not found')
          s=s.replace(old,new,1)

          start=s.index('<nav class="navbar">')
          end=s.index('</nav>',start)+len('</nav>')
          nav='''<nav class="navbar">\n  <button class="menu-btn" id="menuBtn" aria-label="Open navigation"><span></span><span></span><span></span></button>\n  <ul class="nav-links" id="navLinks">\n    <li><a href="#shop">Shop</a></li>\n    <li><a href="#collection-316">316</a></li>\n    <li><a href="#about">About</a></li>\n    <li><a href="#contact">Contact</a></li>\n  </ul>\n  <button class="bag-button" id="bagButton" aria-label="Open shopping cart"><span class="bag-count" id="bagCount">0</span></button>\n</nav>'''
          s=s[:start]+nav+s[end:]

          s=s.replace('<div class="collection-image"><img src="/2.png" alt="NSP 316 Collection"></div>','<div class="collection-image"><img id="collection316Image" src="/2.png" alt="NSP 316 Collection"></div>',1)
          s=s.replace('''<section class="statement"><div class="label">Our Foundation</div><p class="statement-text">“For God so loved the world that He gave His one and only Son, that whoever believes in Him shall not perish but have eternal life.”</p><div class="reference">John 3:16</div></section>''','''<section class="statement"><div class="label">Our Foundation</div><p class="statement-text">“For God so <span class="foundation-accent">loved</span> the world that He gave His one and only Son, that whoever believes in Him shall not perish but have <span class="foundation-accent">eternal life</span>.”</p><div class="reference foundation-accent">John 3:16</div></section>''',1)
          s=s.replace('.reference{\n  margin-top:30px;','.foundation-accent{color:var(--burgundy);}\n.reference{\n  margin-top:30px;',1)
          s=s.replace('background:var(--burgundy);\n  color:var(--cream);\n  font-size:10px;\n  font-weight:900;\n  letter-spacing:1.5px;\n  text-transform:uppercase;\n}\n\n/* PRODUCT GALLERY */','background:var(--forest);\n  color:var(--cream);\n  font-size:10px;\n  font-weight:900;\n  letter-spacing:1.5px;\n  text-transform:uppercase;\n}\n\n/* PRODUCT GALLERY */',1)
          # The preceding replacement targets the Add to Bag button only.
          s=s.replace('''  background:var(--burgundy);\n  color:var(--cream);\n  font-size:10px;\n  font-weight:900;\n  letter-spacing:1.5px;\n  text-transform:uppercase;\n}\n.empty{''','''  background:var(--forest);\n  color:var(--cream);\n  font-size:10px;\n  font-weight:900;\n  letter-spacing:1.5px;\n  text-transform:uppercase;\n}\n.empty{''',1)
          s=s.replace('''  background:var(--burgundy);\n  color:var(--cream);\n  font-size:10px;\n  font-weight:900;\n  letter-spacing:1.5px;\n  text-transform:uppercase;\n}\n.checkout-note{''','''  background:var(--forest);\n  color:var(--cream);\n  font-size:10px;\n  font-weight:900;\n  letter-spacing:1.5px;\n  text-transform:uppercase;\n}\n.checkout-note{''',1)

          marker='''<div class="product-image"><img src="${p.image}" alt="${p.name}" loading="lazy"></div>'''
          replacement='''<div class="product-image"><img src="${p.image}" data-front="${p.gallery[0] || p.image}" data-back="${p.gallery[1] || p.image}" alt="${p.name}" loading="lazy"></div>'''
          if marker not in s: raise SystemExit('product image template not found')
          s=s.replace(marker,replacement,1)

          marker='function getProductGallery(product){'
          js='''productsEl.querySelectorAll('.product').forEach(card=>{\n  const image=card.querySelector('.product-image img');\n  if(!image) return;\n  card.addEventListener('mouseenter',()=>{image.src=image.dataset.back||image.dataset.front;});\n  card.addEventListener('mouseleave',()=>{image.src=image.dataset.front||image.src;});\n});\nconst collection316Images=['/2.png','/3.png','/4.png','/5.png','/6.png','/7.png'];\nlet collection316Index=0;\nconst collection316Image=document.getElementById('collection316Image');\nif(collection316Image){setInterval(()=>{collection316Index=(collection316Index+1)%collection316Images.length;collection316Image.style.opacity='0';setTimeout(()=>{collection316Image.src=collection316Images[collection316Index];collection316Image.style.opacity='1';},180);},3200);}\n\n'''
          if marker not in s: raise SystemExit('gallery marker not found')
          s=s.replace(marker,js+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply NSP store UI updates" || exit 0
          git push
