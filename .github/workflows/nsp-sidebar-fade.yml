name: NSP Sidebar and 316 Fade Polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply UI behavior polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
<style id="nsp-sidebar-fade-fix">
/* NSP full-height navigation/cart sidebars */
.navbar{
  transition:transform .45s cubic-bezier(.22,1,.36,1);
  will-change:transform;
}
.navbar.nsp-menu-open{transform:translateX(220px);}
.navbar.nsp-cart-open{transform:translateX(-430px);}
.nav-links{
  overflow:hidden!important;
  overscroll-behavior:none!important;
  touch-action:none;
}
body.nsp-panel-open{overflow:hidden;}
#collection316Image{
  transition:opacity 1s cubic-bezier(.22,1,.36,1)!important;
  will-change:opacity;
}
@media(max-width:800px){
  .navbar.nsp-menu-open{transform:translateX(min(220px,78vw));}
  .navbar.nsp-cart-open{transform:translateX(-100vw);}
  .nav-links{width:min(320px,78vw)!important;}
}
</style>
'''
          if 'nsp-sidebar-fade-fix' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)

          old_316 = "const collection316Images=['/2.png','/3.png','/4.png','/5.png','/6.png','/7.png'];\nlet collection316Index=0;\nconst collection316Image=document.getElementById('collection316Image');\nif(collection316Image){setInterval(()=>{collection316Index=(collection316Index+1)%collection316Images.length;collection316Image.style.opacity='0';setTimeout(()=>{collection316Image.src=collection316Images[collection316Index];collection316Image.style.opacity='1';},180);},3200);}"
          new_316 = "const collection316Images=['/2.png','/3.png','/4.png','/5.png','/6.png','/7.png'];\nlet collection316Index=0;\nconst collection316Image=document.getElementById('collection316Image');\nif(collection316Image){setInterval(()=>{collection316Index=(collection316Index+1)%collection316Images.length;collection316Image.style.opacity='0';setTimeout(()=>{collection316Image.src=collection316Images[collection316Index];requestAnimationFrame(()=>{collection316Image.style.opacity='1';});},650);},4500);}"
          if old_316 in s:
              s = s.replace(old_316, new_316, 1)
          else:
              raise SystemExit('Expected 316 carousel block not found; refusing to modify index.html')

          script = r'''
<script id="nsp-sidebar-fade-script">
(function(){
  const navbar=document.querySelector('.navbar');
  const menuBtn=document.getElementById('menuBtn');
  const navLinks=document.getElementById('navLinks');
  const bagButton=document.getElementById('bagButton');
  const bagPanel=document.getElementById('bagPanel');
  const bagClose=document.getElementById('bagClose');
  if(!navbar||!menuBtn||!navLinks||!bagButton||!bagPanel) return;

  const closeMenu=()=>{
    navLinks.classList.remove('active');
    navbar.classList.remove('nsp-menu-open');
    document.body.classList.remove('nsp-panel-open');
  };
  const openMenu=()=>{
    bagPanel.classList.remove('open');
    navbar.classList.remove('nsp-cart-open');
    navLinks.classList.add('active');
    navbar.classList.add('nsp-menu-open');
    document.body.classList.add('nsp-panel-open');
  };
  menuBtn.onclick=()=>navLinks.classList.contains('active')?closeMenu():openMenu();
  navLinks.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeMenu));

  const closeCart=()=>{
    bagPanel.classList.remove('open');
    navbar.classList.remove('nsp-cart-open');
    document.body.classList.remove('nsp-panel-open');
  };
  const openCart=()=>{
    navLinks.classList.remove('active');
    navbar.classList.remove('nsp-menu-open');
    bagPanel.classList.add('open');
    navbar.classList.add('nsp-cart-open');
    document.body.classList.add('nsp-panel-open');
  };
  bagButton.onclick=openCart;
  if(bagClose) bagClose.onclick=closeCart;

  const checkout=document.getElementById('checkout');
  if(checkout){
    checkout.addEventListener('click',()=>{
      navbar.classList.remove('nsp-cart-open');
      document.body.classList.remove('nsp-panel-open');
    });
  }
  const checkoutClose=document.getElementById('checkoutClose');
  if(checkoutClose){
    checkoutClose.addEventListener('click',()=>{
      document.body.classList.remove('nsp-panel-open');
    });
  }
})();
</script>
'''
          if 'nsp-sidebar-fade-script' not in s:
              s = s.replace('</body>', script + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Polish NSP sidebars and 316 fade transition"
            git push
          fi
