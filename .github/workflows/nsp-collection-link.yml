name: NSP collection landing link
on:
  push:
    paths:
      - '.github/nsp-collection-trigger.txt'
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect collection button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='NSP COLLECTION LANDING LINK 2026-09-02'
          start=s.find('<script id="nsp-collection-landing-script">')
          end=s.find('</script>', start)
          patch='''<style id="nsp-collection-landing-link">
          /* NSP COLLECTION LANDING LINK 2026-09-02 */
          </style>
          <script id="nsp-collection-landing-script">
          (function(){
            function bindCollectionLink(){
              if(window.__nspCollectionLinkBound)return;
              window.__nspCollectionLinkBound=true;
              document.addEventListener('click',function(e){
                const el=e.target.closest('a,button');
                if(!el)return;
                const label=(el.textContent||'').replace(/\\s+/g,' ').trim().toUpperCase();
                const href=(el.getAttribute('href')||'').toLowerCase();
                const isCollectionAction=label.includes('COLLECTION') || href.includes('collection');
                if(isCollectionAction){
                  e.preventDefault();
                  e.stopPropagation();
                  window.location.assign('/collection.html');
                }
              },true);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bindCollectionLink);else bindCollectionLink();
          })();
          </script>
          '''
          if start >= 0 and end >= 0:
            s=s[:s.find('<style id="nsp-collection-landing-link">', max(0,start-2000))]+patch+s[end+9:]
          else:
            s=s.replace('</head>',patch+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit collection link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix featured collection button targeting"
          git push
