name: NSP cart landing page fix
on:
  push:
    paths:
      - '.github/nsp-cart-landing-trigger.txt'
permissions:
  contents: write
jobs:
  fix-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cart landing page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='NSP CART LANDING PAGE 2026-09-02'
          if marker not in s:
            css='''<style id="nsp-cart-landing-page">\n/* NSP CART LANDING PAGE 2026-09-02 */\nbody.nsp-cart-landing{overflow:auto!important}\nbody.nsp-cart-landing .bag-button{display:none!important}\nbody.nsp-cart-landing .bag-panel{position:fixed!important;inset:0!important;width:100%!important;max-width:none!important;height:100vh!important;margin:0!important;padding:0!important;background:var(--cream)!important;color:var(--black)!important;transform:none!important;right:auto!important;left:0!important;top:0!important;z-index:6000!important;overflow-y:auto!important;box-shadow:none!important}\nbody.nsp-cart-landing .bag-panel.open{display:block!important}\nbody.nsp-cart-landing .bag-panel .bag-header{position:sticky!important;top:0!important;z-index:2!important;background:var(--cream)!important;border-bottom:1px solid rgba(10,10,10,.12)!important;padding:28px 5%!important}\nbody.nsp-cart-landing .bag-panel .bag-body{min-height:calc(100vh - 90px)!important;padding:70px 8%!important}\nbody.nsp-cart-landing .bag-panel .bag-close,body.nsp-cart-landing .bag-panel .close{position:fixed!important;right:5%!important;top:24px!important;z-index:10!important}\n</style>'''
            js='''<script id="nsp-cart-landing-script">\n(function(){\n  function initCartLanding(){\n    const bag=document.getElementById('bagButton');\n    const panel=document.getElementById('bagPanel');\n    if(!bag||!panel||bag.dataset.cartLandingBound)return;\n    bag.dataset.cartLandingBound='1';\n    function openCartPage(e){\n      if(e)e.preventDefault();\n      document.body.classList.remove('nsp-menu-open','nsp-cart-open','nsp-panel-open');\n      document.body.classList.add('nsp-cart-landing');\n      panel.classList.add('open');\n      window.scrollTo({top:0,behavior:'smooth'});\n    }\n    function closeCartPage(){\n      panel.classList.remove('open');\n      document.body.classList.remove('nsp-cart-landing','nsp-cart-open','nsp-panel-open');\n      window.scrollTo({top:0,behavior:'smooth'});\n    }\n    bag.onclick=openCartPage;\n    const close=panel.querySelector('#bagClose,.bag-close,.close');\n    if(close)close.addEventListener('click',closeCartPage);\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initCartLanding);else initCartLanding();\n})();\n</script>'''
            s=s.replace('</head>',css+'\n</head>',1)
            s=s.replace('</body>',js+'\n</body>',1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cart landing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make cart a full landing page"
          git push
