name: Finalize NSP menu
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-nsp-menu.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide desktop menu until clicked
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''.nav-links{\n  display:flex;\n  gap:30px;\n  list-style:none;'''
          new='''.nav-links{\n  position:absolute;\n  top:78px;\n  left:5%;\n  display:none;\n  flex-direction:column;\n  align-items:flex-start;\n  gap:18px;\n  padding:22px 26px;\n  background:var(--black);\n  color:var(--cream);\n  mix-blend-mode:normal;\n  list-style:none;'''
          if old not in s: raise SystemExit('nav links block not found')
          s=s.replace(old,new,1)
          marker='.nav-links a:hover{\n  opacity:.55;\n}'
          addition='''.nav-links.active{display:flex;}\n'''
          if marker not in s: raise SystemExit('nav hover marker not found')
          s=s.replace(marker,marker+'\n'+addition,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize NSP hamburger navigation" || exit 0
          git push
