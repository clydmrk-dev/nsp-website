name: NSP UI polish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ui-polish.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested UI polish
        run: python scripts/nsp_sidebar_fade.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish NSP sidebars and 316 fade transition" || exit 0
          git push
