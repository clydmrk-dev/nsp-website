name: NSP Hero Position Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-hero:
    if: "!contains(github.event.head_commit.message, 'Fix NSP hero title and eyebrow centering')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Center hero title and eyebrow without moving hero controls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = '<style id="nsp-hero-position-fix">'
          if marker in html:
              print('Hero position fix already present; nothing to do.')
              raise SystemExit(0)

          fix = '''<style id="nsp-hero-position-fix">
          /* Keep the existing hero copy and Explore Collection control in place. */
          .hero { position:relative; }
          .hero .eyebrow {
            position:absolute;
            z-index:2;
            left:50%;
            top:calc(50% - 88px);
            transform:translateX(-50%);
            width:max-content;
            max-width:90vw;
            margin:0;
            text-align:center;
            white-space:nowrap;
          }
          .hero h1 {
            position:absolute;
            z-index:2;
            left:50%;
            top:50%;
            width:100%;
            margin:0;
            transform:translate(-50%,-50%);
            text-align:center;
            white-space:nowrap;
          }
          @media (max-width:700px) {
            .hero .eyebrow {
              top:calc(50% - 58px);
              max-width:94vw;
              font-size:9px;
              letter-spacing:2px;
            }
            .hero h1 {
              font-size:clamp(34px,10vw,80px);
            }
          }
          </style>'''

          html = html.replace('</head>', fix + '\n</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit hero fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix NSP hero title and eyebrow centering"
          git push

      - name: Remove this one-time workflow
        if: success()
        run: |
          git rm .github/workflows/nsp-hero-fix.yml
          git commit -m "Remove one-time NSP hero fix workflow"
          git push
