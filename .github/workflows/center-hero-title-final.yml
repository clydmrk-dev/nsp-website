name: Fine tune NSP hero title center

on:
  push:
    paths:
      - '.github/workflows/center-hero-title-final.yml'

permissions:
  contents: write

jobs:
  center-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fine tune title position
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'transform:translateY(calc(-50vh + 139px + 4vw));'
          new = 'transform:translateY(calc(-50vh + 113px + 4vw));'
          if old not in s:
              raise SystemExit('Expected title positioning rule not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fine tune NSP hero title center'
          git push