name: NSP shop menu link
on:
  push:
    paths:
      - '.github/nsp-shop-menu-trigger.txt'
permissions:
  contents: write
jobs:
  patch-shop-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route Shop menu to collection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<li><a href="#shop">Shop</a></li>'
          new='<li><a href="/collection.html">Shop</a></li>'
          if old not in s:
              raise SystemExit('Expected Shop menu link was not found; no change made.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Route Shop menu to collection page"
          git push
