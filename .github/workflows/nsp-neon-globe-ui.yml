name: NSP Neon Globe UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply NSP cinematic globe hero
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '/* NSP CINEMATIC GLOBE UI V1 */'

          if marker in html:
              print('Cinematic globe UI already applied.')
              raise SystemExit(0)

          css = r'''
          /* NSP CINEMATIC GLOBE UI V1 */
          .hero{
            min-height:100svh;
            padding:100px 4.5% 44px;
            display:block;
            background:
              radial-gradient(circle at 72% 48%, rgba(177,39,255,.10), transparent 25%),
              radial-gradient(circle at 78% 66%, rgba(255,0,214,.08), transparent 22%),
              #030303;
          }
          .hero:before{display:none;}
          .hero:after{
            right:4.5%;
            top:50%;
            transform:translateY(-50%);
            opacity:.5;
            color:#fff;
          }
          .hero-globe{
            position:absolute;
            z-index:1;
            width:min(48vw,690px);
            aspect-ratio:1;
            right:7%;
            top:50%;
            transform:translateY(-50%);
            border-radius:50%;
            background:
              radial-gradient(circle at 34% 28%, rgba(255,255,255,.9) 0 1.2%, transparent 2%),
              radial-gradient(circle at 42% 35%, rgba(255,255,255,.7) 0 1%, transparent 1.8%),
              radial-gradient(circle at 63% 55%, rgba(255,0,220,.8) 0 1.1%, transparent 2%),
              radial-gradient(circle at 45% 40%, #7d19bd 0%, #3b075c 20%, #12051c 48%, #020205 72%);
            box-shadow:
              0 0 30px rgba(155,45,255,.9),
              0 0 90px rgba(214,0,255,.45),
              inset -35px -25px 70px rgba(0,0,0,.9),
              inset 18px 15px 35px rgba(255,80,255,.35);
          }
          .hero-globe:before,
          .hero-globe:after{
            content:"";
            position:absolute;
            inset:2.5%;
            border-radius:50%;
            pointer-events:none;
          }
          .hero-globe:before{
            background:
              repeating-linear-gradient(90deg, transparent 0 12%, rgba(236,117,255,.35) 12.2% 12.5%, transparent 12.7% 25%),
              repeating-linear-gradient(0deg, transparent 0 12%, rgba(236,117,255,.27) 12.2% 12.5%, transparent 12.7% 25%);
            opacity:.55;
            transform:perspective(500px) rotateY(-10deg) scaleX(.92);
            mix-blend-mode:screen;
          }
          .hero-globe:after{
            border:2px solid rgba(151,83,255,.9);
            box-shadow:0 0 18px rgba(255,40,230,.8), inset 0 0 12px rgba(255,40,230,.35);
          }
          .globe-land{
            position:absolute;
            inset:10% 14%;
            border-radius:48% 52% 45% 55%;
            background:
              radial-gradient(ellipse at 25% 28%, rgba(255,112,255,.95) 0 8%, transparent 9%),
              radial-gradient(ellipse at 35% 24%, rgba(240,85,255,.85) 0 7%, transparent 8%),
              radial-gradient(ellipse at 57% 54%, rgba(255,70,241,.9) 0 9%, transparent 10%),
              radial-gradient(ellipse at 67% 69%, rgba(216,52,255,.8) 0 8%, transparent 9%),
              radial-gradient(ellipse at 48% 45%, rgba(238,80,255,.65) 0 18%, transparent 19%);
            filter:blur(7px);
            opacity:.75;
            transform:rotate(-12deg);
          }
          .globe-ring{
            position:absolute;
            left:-8%;
            right:-8%;
            bottom:-3%;
            height:20%;
            border-radius:50%;
            border-top:2px solid rgba(227,64,255,.8);
            box-shadow:0 -2px 30px rgba(221,0,255,.8), 0 0 50px rgba(138,55,255,.4);
            transform:rotate(-2deg);
          }
          .hero-floor{
            position:absolute;
            z-index:0;
            left:42%;
            right:0;
            bottom:-7%;
            height:31%;
            background:
              repeating-linear-gradient(90deg, transparent 0 8%, rgba(191,44,255,.13) 8.1% 8.3%),
              repeating-linear-gradient(0deg, transparent 0 15%, rgba(191,44,255,.12) 15.1% 15.4%);
            transform:perspective(260px) rotateX(62deg);
            filter:blur(.2px);
            opacity:.75;
            mask-image:linear-gradient(to bottom, #000, transparent 85%);
          }
          .hero-content{
            position:relative;
            z-index:3;
            min-height:calc(100svh - 144px);
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:flex-start;
            max-width:46%;
          }
          .hero-logo{width:min(38vw,590px);margin:22px 0 0;}
          .hero-logo img{max-height:38vh;filter:brightness(0) invert(1);}
          .eyebrow{margin-bottom:0;opacity:.58;}
          .hero-bottom{
            margin-top:34px;
            padding-top:0;
            border-top:0;
            display:flex;
            flex-direction:column;
            align-items:flex-start;
            gap:22px;
          }
          .hero-copy{max-width:370px;color:rgba(255,255,255,.7);}
          .button{border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;}
          .button:hover{background:#fff;color:#111;}
          .marquee{background:#030303;border-color:#222;}
          .section{background:#050505;color:#fff;}
          .section .label,.section .text-link{color:#fff;}
          .section .text-link{border-color:#fff;}
          .product-image{background:#101010;}
          .product-name,.product-price{color:#fff;}
          .product-cta{border-color:#fff;color:#fff;}
          .product-cta:hover{background:#fff;color:#111;}
          .collection{background:#080808;}
          .collection-image{background:#0d0d0d;}
          .statement{background:#050505;color:#fff;}
          .statement .label,.statement .reference{color:#fff;}
          .about{background:#f1f0eb;color:#111;}
          .social{background:#030303;}
          @media(max-width:800px){
            .hero{padding:90px 5% 35px;min-height:100svh;}
            .hero-content{max-width:100%;min-height:calc(100svh - 125px);justify-content:flex-end;padding-bottom:15px;}
            .hero-globe{width:78vw;right:-13%;top:35%;opacity:.92;}
            .hero-floor{left:10%;right:-15%;bottom:5%;height:25%;}
            .hero-logo{width:min(78vw,500px);margin-top:16px;}
            .hero-logo img{max-height:30vh;}
            .hero-bottom{margin-top:25px;}
            .hero-copy{max-width:285px;font-size:12px;}
            .hero:after{right:3%;top:48%;}
          }
          '''

          hero_open = '<header class="hero">'
          hero_content = '''<header class="hero">
            <div class="hero-globe" aria-hidden="true"><span class="globe-land"></span><span class="globe-ring"></span></div>
            <div class="hero-floor" aria-hidden="true"></div>
            <div class="hero-content">'''

          html = html.replace(hero_open, hero_content, 1)
          html = html.replace('</header>\n\n<div class="marquee">', '</div>\n</header>\n\n<div class="marquee">', 1)
          html = html.replace('</style>', css + '\n</style>', 1)
          path.write_text(html, encoding='utf-8')
          print('Applied cinematic neon globe hero UI.')

      - name: Commit UI update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Create cinematic neon globe NSP hero"
          git push
