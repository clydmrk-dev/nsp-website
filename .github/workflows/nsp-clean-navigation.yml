name: NSP clean navigation shell
on:
  push:
    paths:
      - '.github/nsp-clean-shell-trigger.txt'
permissions:
  contents: write
jobs:
  clean-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clean navigation shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='NSP CLEAN NAV SHELL 15VW 2026-09-02'
          if marker in s: raise SystemExit('already installed')
          css='''<style id="nsp-clean-nav-15vw">\n/* NSP CLEAN NAV SHELL 15VW 2026-09-02 */\n:root{--nsp-drawer:25vw;--nsp-cart-drawer:25vw;--nsp-shift:15vw;--nsp-ease:cubic-bezier(.22,.61,.36,1)}\nhtml,body{width:100%;max-width:100%;overflow-x:hidden}\nbody{padding:0!important;margin:0!important}\n#nsp-site-canvas{width:100%;min-height:100vh;transform:none;transition:transform .45s var(--nsp-ease);will-change:transform}\nbody.nsp-menu-open #nsp-site-canvas{transform:translate3d(var(--nsp-shift),0,0)!important}\nbody.nsp-cart-open #nsp-site-canvas{transform:translate3d(calc(-1 * var(--nsp-shift)),0,0)!important}\n.navbar{position:fixed!important;top:0!important;left:0!important;right:0!important;z-index:5000!important;transform:none!important;mix-blend-mode:difference!important}\n.navbar .menu-btn,.navbar .bag-button{position:fixed!important;top:22px!important;z-index:5002!important}\n.navbar .menu-btn{left:5%!important}\n.navbar .bag-button{right:5%!important}\nbody.nsp-menu-open .navbar .menu-btn,body.nsp-cart-open .navbar .bag-button{display:none!important}\n.navbar .nav-links.active{display:flex!important;position:fixed!important;top:0!important;left:0!important;width:var(--nsp-drawer)!important;min-width:var(--nsp-drawer)!important;max-width:var(--nsp-drawer)!important;height:100vh!important;padding:80px 48px!important;margin:0!important;background:var(--cream)!important;color:var(--black)!important;mix-blend-mode:normal!important;z-index:5001!important;transform:none!important;box-shadow:none!important;overflow:hidden!important}\n.navbar .nav-links.active a{color:var(--black)!important}\nbody.nsp-menu-open{overflow:hidden!important}\nbody.nsp-cart-open .bag-panel{position:fixed!important;top:0!important;right:0!important;left:auto!important;width:var(--nsp-cart-drawer)!important;max-width:var(--nsp-cart-drawer)!important;height:100vh!important;z-index:5001!important;transform:none!important;overflow-y:auto!important;background:var(--cream)!important;box-shadow:none!important}\nbody.nsp-cart-open{overflow:auto!important}\nbody.nsp-menu-open>main,body.nsp-menu-open>footer,body.nsp-cart-open>main,body.nsp-cart-open>footer{transform:none!important;width:auto!important;margin:0!important;padding:0!important}\n</style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit clean shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Set NSP navigation canvas shift to 15vw"
          git push
