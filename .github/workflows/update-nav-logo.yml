name: Update NSP navigation logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-nav:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace navbar text with white NSP logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '  <a href="#top" class="logo">NSP</a>'
          new = '  <a href="#top" class="logo"><img src="/logonsp.png" alt="None Shall Perish"></a>'
          if old not in s:
              raise SystemExit('Expected navbar logo markup was not found.')
          s = s.replace(old, new, 1)
          css = '''\n.logo{\n  display:flex;\n  align-items:center;\n  width:72px;\n  height:40px;\n}\n.logo img{\n  width:100%;\n  height:100%;\n  object-fit:contain;\n  filter:brightness(0) invert(1);\n}\n'''
          marker = '.nav-links{\n'
          if '.logo img{' not in s:
              s = s.replace(marker, css + marker, 1)
          p.write_text(s)
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-nav-logo.yml
          git add index.html .github/workflows/update-nav-logo.yml
          git diff --cached --quiet || git commit -m "Use white NSP logo in website header"
          git push
