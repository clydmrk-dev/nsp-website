<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f4f3ef">
<title>NSP Admin — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f3ef;color:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:min(390px,100%);background:#fff;border:1px solid #ddd;padding:30px 34px 28px;box-shadow:0 14px 40px rgba(0,0,0,.04)}
.logo-wrap{display:flex;justify-content:center;align-items:center;margin-bottom:24px;min-height:210px}
.logo{display:block;width:min(330px,96%);height:auto;max-height:240px;object-fit:contain}
.eyebrow{font-size:10px;font-weight:900;letter-spacing:2.2px;text-transform:uppercase;color:#555;margin-bottom:10px}
.subtitle{font-size:13px;color:#777;line-height:1.5;margin-bottom:26px}
.field{margin-bottom:17px}
.field label{display:block;font-size:10px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:7px}
.field input{width:100%;height:48px;padding:12px;border:1px solid #cfcfcf;background:#fff;outline:none;font-size:14px;color:#111}
.field input:focus{border-color:#111}
.login-btn{width:100%;height:48px;border:1px solid #111;background:#111;color:#fff;padding:13px;font-size:11px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase;margin-top:2px;cursor:pointer}
.login-btn:disabled{opacity:.5;cursor:wait}
.error{background:#fff0f0;color:#8b2222;border:1px solid #ecc;padding:11px;font-size:12px;margin-bottom:15px;display:none}
.footer{margin-top:25px;text-align:center;font-size:9px;color:#999;letter-spacing:1.5px;text-transform:uppercase}
@media(max-width:600px){.login{padding:26px 24px 24px}.logo-wrap{min-height:170px;margin-bottom:20px}.logo{width:min(300px,96%)}.subtitle{font-size:13px;margin-bottom:24px}}
</style>
</head>
<body>
<main class="login">
<div class="logo-wrap"><img class="logo" src="/logonspfinal.png" alt="None Shall Perish"></div>
<div class="eyebrow">Secure access</div>
<p class="subtitle">Sign in to manage NSP orders and inventory.</p>
<div id="error" class="error"></div>
<form id="loginForm">
<div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<button class="login-btn" id="loginBtn" type="submit">Sign In</button>
</form>
<div class="footer">None Shall Perish · Admin</div>
</main>
<script>
const form=document.getElementById('loginForm');const error=document.getElementById('error');const button=document.getElementById('loginBtn');
(async()=>{try{const r=await fetch('/api/admin-session');const d=await r.json();if(r.ok&&d.ok)location.replace('/admin.html')}catch(e){}})();
form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';button.disabled=true;button.textContent='SIGNING IN...';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.error||'Unable to sign in.');location.replace('/admin.html')}catch(err){error.textContent=err.message;error.style.display='block';button.disabled=false;button.textContent='SIGN IN'}});
</script>
</body>
</html>
