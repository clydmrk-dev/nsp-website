<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f4f3ef">
<title>NSP Admin — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f3ef;color:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:min(330px,100%);background:#fff;border:1px solid #ddd;padding:22px 26px 24px;box-shadow:0 14px 40px rgba(0,0,0,.05)}
.logo-wrap{display:flex;justify-content:center;align-items:center;margin-bottom:18px;min-height:220px}
.logo{display:block;width:min(520px,150%);height:auto;max-height:260px;object-fit:contain}
.field{margin-bottom:14px}
.field label{display:block;font-size:9px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;margin-bottom:6px}
.field input{width:100%;height:44px;padding:10px;border:1px solid #cfcfcf;background:#fff;outline:none;font-size:13px;color:#111}
.field input:focus{border-color:#111}
.login-btn{width:100%;height:44px;border:1px solid #111;background:#111;color:#fff;padding:12px;font-size:10px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;margin-top:1px;cursor:pointer}
.login-btn:disabled{opacity:.5;cursor:wait}
.error{background:#fff0f0;color:#8b2222;border:1px solid #ecc;padding:10px;font-size:11px;margin-bottom:13px;display:none}
.footer{margin-top:18px;text-align:center;font-size:8px;color:#999;letter-spacing:1.4px;text-transform:uppercase}
@media(max-width:600px){body{padding:18px}.login{width:min(310px,100%);padding:20px 22px 22px}.logo-wrap{min-height:190px;margin-bottom:16px}.logo{width:min(460px,150%);max-height:220px}}
</style>
</head>
<body>
<main class="login">
<div class="logo-wrap"><img class="logo" src="/ChatGPT%20Image%20Aug%2028,%202026,%2011_33_42%20PM.png" alt="None Shall Perish"></div>
<div id="error" class="error"></div>
<form id="loginForm">
<div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<button class="login-btn" id="loginBtn" type="submit">Sign In</button>
</form>
<div class="footer">None Shall Perish · Admin</div>
</main>
<script>
const form=document.getElementById('loginForm');const error=document.getElementById('error');const button=document.getElementById('loginBtn');
(async()=>{try{const r=await fetch('/api/admin-session');const d=await r.json();if(r.ok&&d.ok)location.replace('/admin.html')}catch(e){}})();
form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';button.disabled=true;button.textContent='SIGNING IN...';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.error||'Unable to sign in.');location.replace('/admin.html')}catch(err){error.textContent=err.message;error.style.display='block';button.disabled=false;button.textContent='SIGN IN'}});
</script>
</body>
</html>
