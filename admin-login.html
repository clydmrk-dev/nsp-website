<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f4f3ef">
<title>NSP Admin — Login</title>
<link rel="icon" type="image/png" href="/logonspfinal.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f3ef;color:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:auto}
.login-wrap{width:min(720px,calc(100vw - 36px));display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
.logo{display:block;width:720px;height:240px;max-width:100%;object-fit:contain;margin-bottom:18px}
.login{width:min(360px,100%);background:#fff;border:1px solid #ddd;padding:20px 22px 21px;box-shadow:0 12px 32px rgba(0,0,0,.08)}
.field{margin-bottom:12px}.field label{display:block;font-size:8px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:5px}.field input{width:100%;height:40px;padding:9px;border:1px solid #cfcfcf;background:#fff;outline:none;font-size:12px;color:#111}.field input:focus{border-color:#111}
.login-btn{width:100%;height:40px;border:1px solid #111;background:#111;color:#fff;padding:10px;font-size:9px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;margin-top:1px;cursor:pointer}.login-btn:disabled{opacity:.5;cursor:wait}
.error{background:#fff0f0;color:#8b2222;border:1px solid #ecc;padding:9px;font-size:10px;margin-bottom:12px;display:none}.footer{margin-top:15px;text-align:center;font-size:7px;color:#999;letter-spacing:1.3px;text-transform:uppercase}
@media(max-width:600px){body{padding:18px}.login-wrap{width:100%}.logo{width:480px;height:170px;margin-bottom:14px}.login{width:min(300px,100%);padding:18px 20px 19px}}
</style>
</head>
<body>
<div class="login-wrap">
<img class="logo" src="/logonspfinal.png" alt="None Shall Perish">
<main class="login">
<div id="error" class="error"></div>
<form id="loginForm">
<div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<button class="login-btn" id="loginBtn" type="submit">Sign In</button>
</form>
<div class="footer">None Shall Perish · Admin</div>
</main>
</div>
<script>
const form=document.getElementById('loginForm');const error=document.getElementById('error');const button=document.getElementById('loginBtn');
(async()=>{try{const r=await fetch('/api/admin-session');const d=await r.json();if(r.ok&&d.ok)location.replace('/admin.html')}catch(e){}})();
form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';button.disabled=true;button.textContent='SIGNING IN...';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.error||'Unable to sign in.');location.replace('/admin.html')}catch(err){error.textContent=err.message;error.style.display='block';button.disabled=false;button.textContent='SIGN IN'}});
</script>
</body>
</html>
