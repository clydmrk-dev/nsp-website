<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NSP — Your Bag</title>
<link rel="icon" type="image/png" href="/logonspfinal.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#123B2A;--cream:#F4F1E8;--line:#d6d0c4;--black:#0a0a0a}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Inter,Arial,sans-serif;background:#fff;color:var(--black);min-height:100vh}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
.header{height:120px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 5%;position:relative}.menu{justify-self:start;border:0;background:none;font-size:0;width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;gap:6px}.menu span{display:block;width:28px;height:2px;background:#111}
.logo{display:block;width:360px;height:105px;object-fit:contain}.logo-link{display:flex;align-items:center;justify-content:center;width:360px;height:105px}
.bag{justify-self:end;border:0;background:none;width:42px;height:42px;display:flex;align-items:center;justify-content:center;padding:0;color:#111}.bag svg{width:28px;height:28px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:min(1260px,calc(100% - 10%));margin:0 auto;padding:35px 0 70px}.title{text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:58px;font-weight:600;letter-spacing:-.055em;text-transform:uppercase;margin-bottom:65px}.columns{display:grid;grid-template-columns:1fr 155px 170px;border-bottom:1px solid #555;padding-bottom:18px;font-size:13px;letter-spacing:1px;text-transform:uppercase}.columns span:nth-child(2),.columns span:nth-child(3){text-align:center}.items{border-bottom:1px solid #555}.item{display:grid;grid-template-columns:220px 1fr 155px 170px;gap:25px;align-items:center;min-height:290px;border-bottom:1px solid var(--line);padding:28px 0}.item:last-child{border-bottom:0}.photo{width:220px;height:220px;background:#eee;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:contain}.info h2{font-size:16px;font-weight:500;text-transform:uppercase;line-height:1.15;max-width:230px}.info p{font-size:12px;margin-top:10px;opacity:.65}.remove{margin-top:10px;border:0;background:none;text-decoration:underline;font-size:12px}.qty{text-align:center}.qty input{width:88px;height:48px;border:0;background:#f6f6f6;text-align:center;font-size:15px}.price{text-align:center;font-size:14px}.summary{display:flex;flex-direction:column;align-items:flex-end;padding-top:22px}.subtotal{display:grid;grid-template-columns:170px 170px;gap:20px;font-size:14px;text-transform:uppercase}.subtotal strong{text-align:right}.note{margin-top:20px;font-size:13px;font-style:italic}.actions{display:flex;gap:20px;margin-top:25px}.action{min-width:160px;height:50px;padding:0 22px;border:1px solid var(--forest);background:var(--forest);color:var(--cream);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}.action.secondary{background:#fff;color:var(--forest)}.empty{text-align:center;padding:90px 20px;font-family:'Cormorant Garamond',Georgia,serif;font-size:40px}.back{display:inline-block;margin-top:25px;font:700 10px Inter,Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;text-decoration:underline}
@media(max-width:800px){.header{height:100px;padding:0 6%}.logo-link{width:210px;height:75px}.logo{width:210px;height:75px}.bag svg{width:25px;height:25px}.wrap{width:88%;padding-top:25px}.title{font-size:46px;margin-bottom:40px}.columns{grid-template-columns:1fr 90px 100px}.item{grid-template-columns:105px 1fr;gap:18px;min-height:170px}.photo{width:105px;height:125px;grid-row:span 2}.qty,.price{text-align:left}.qty input{width:65px;height:40px}.summary{align-items:stretch}.subtotal{grid-template-columns:1fr 1fr}.actions{flex-direction:column}}
</style>
</head>
<body>
<header class="header"><button class="menu" id="menu" aria-label="Open menu"><span></span><span></span><span></span></button><a class="logo-link" href="/" aria-label="NSP Home"><img class="logo" src="/logonspfinal.png" alt="None Shall Perish"></a><button class="bag" id="bag" aria-label="Shopping bag"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8.5h14l-1 11H6l-1-11Z"></path><path d="M8.5 8.5V6.75a3.5 3.5 0 0 1 7 0V8.5"></path></svg></button></header>
<main class="wrap"><h1 class="title">Your Bag</h1><div id="cart"></div></main>
<script>
const cartEl=document.getElementById('cart');let bag=JSON.parse(localStorage.getItem('nspBag')||'[]');const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
function render(){if(!bag.length){cartEl.innerHTML='<div class="empty">Your bag is empty.<br><a class="back" href="/">Continue Shopping →</a></div>';return}cartEl.innerHTML='<div class="columns"><span>Product</span><span>Quantity</span><span>Total</span></div><div class="items">'+bag.map((p,i)=>`<div class="item"><div class="photo"><img src="${p.image}" alt="${p.name}"></div><div class="info"><h2>${p.name}</h2><p>Size ${p.size} · ${money(p.price)}</p><button class="remove" data-remove="${i}">Remove</button></div><div class="qty"><input data-qty="${i}" type="number" min="1" value="1"></div><div class="price">${money(p.price)}</div></div>`).join('')+'</div><div class="summary"><div class="subtotal"><span>Subtotal</span><strong>'+money(bag.reduce((s,p)=>s+Number(p.price||0),0))+'</strong></div><div class="note">Taxes and shipping calculated at checkout</div><div class="actions"><button class="action secondary" id="update">Update Cart</button><button class="action" id="checkout">Check Out →</button></div></div>'}
cartEl.addEventListener('click',e=>{const r=e.target.closest('[data-remove]');if(r){bag.splice(Number(r.dataset.remove),1);localStorage.setItem('nspBag',JSON.stringify(bag));render()}if(e.target.id==='update')alert('Your cart is updated.');if(e.target.id==='checkout'&&!bag.length)return;if(e.target.id==='checkout')window.location.href='/#checkout'});render();
</script>
</body>
</html>
