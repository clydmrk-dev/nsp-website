<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NSP — Product</title>
<link rel="icon" type="image/png" href="/logonspfinal.png">
<style>
:root{--forest:#123B2A;--cream:#F4F1E8;--black:#0A0A0A;--line:#d8d4cb}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--black);overflow-x:hidden}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.header{height:120px;padding:0 5%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;position:relative;background:#fff}.menu{justify-self:start;border:0;background:none;width:34px;height:34px;display:flex;flex-direction:column;justify-content:center;gap:5px}.menu span{display:block;width:28px;height:2px;background:#111}.logo-link{display:flex;align-items:center;justify-content:center;width:360px;height:120px}.logo{width:360px;height:120px;object-fit:contain}.bag{justify-self:end;border:0;background:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;position:relative}.bag svg{width:25px;height:25px;stroke:#111;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.count{position:absolute;right:-3px;top:-2px;min-width:15px;height:15px;border-radius:50%;background:var(--forest);color:var(--cream);font-size:8px;display:flex;align-items:center;justify-content:center}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(360px,82vw);background:var(--forest);color:var(--cream);z-index:30;transform:translateX(-100%);transition:transform .3s;padding:120px 28px}.drawer.open{transform:translateX(0)}.drawer a{display:block;padding:17px 18px;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.drawer a:hover{background:var(--cream);color:var(--forest)}.drawer-close{position:absolute;right:22px;top:25px;border:0;background:none;color:var(--cream);font-size:25px}
.product-page{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(350px,.85fr);min-height:calc(100vh - 120px)}.visual{display:flex;align-items:center;justify-content:center;padding:50px 6%;background:#fff;min-height:700px}.visual img{width:100%;height:100%;max-height:760px;object-fit:contain}.details{padding:90px 9% 70px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.45;margin-bottom:15px}.title{font-size:clamp(34px,4.2vw,62px);line-height:.9;letter-spacing:-.06em;text-transform:uppercase;color:var(--forest)}.price{font-size:18px;margin-top:25px}.label{font-size:11px;margin-top:50px;margin-bottom:14px}.sizes{display:flex;gap:12px}.size{width:48px;height:42px;background:#fff;border:1px solid #aaa;font-size:11px}.size.active{border:1px solid var(--black);background:var(--cream)}.quantity{width:100%;height:50px;background:#f6f6f6;border:0;padding:0 16px;font-size:14px}.add{height:54px;margin-top:14px;border:1px solid var(--forest);background:var(--forest);color:var(--cream);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.add:hover{background:var(--cream);color:var(--forest)}.notice{min-height:18px;margin-top:14px;font-size:11px}.tabs{display:flex;gap:30px;margin-top:50px;border-bottom:1px solid var(--line);padding-bottom:12px}.tab{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.copy{margin-top:22px;max-width:510px;font-size:13px;line-height:1.7}.back{display:inline-block;margin-top:40px;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;text-decoration:underline}
@media(max-width:900px){.product-page{grid-template-columns:1fr}.visual{min-height:55vh;padding:30px 8%}.details{padding:55px 8% 70px}.header{height:100px}.logo-link,.logo{width:240px;height:85px}.drawer{padding-top:100px}}
</style>
</head>
<body>
<header class="header"><button class="menu" id="menu" aria-label="Open menu"><span></span><span></span><span></span></button><a class="logo-link" href="/" aria-label="NSP Home"><img class="logo" src="/logonspfinal.png" alt="None Shall Perish"></a><a class="bag" href="/cart.html" aria-label="Shopping bag"><svg viewBox="0 0 24 24"><path d="M5 8.5h14l-1 11H6l-1-11Z"></path><path d="M8.5 8.5V6.75a3.5 3.5 0 0 1 7 0V8.5"></path></svg><span class="count" id="count">0</span></a></header>
<nav class="drawer" id="drawer"><button class="drawer-close" id="drawerClose">×</button><a href="/">Home</a><a href="/collection.html">Shop</a><a href="/#about">About</a><a href="/#contact">Contact</a><a href="/cart.html">Cart</a></nav>
<main class="product-page"><section class="visual"><img id="photo" src="/1.png" alt="NSP Collection 01"></section><section class="details"><div class="eyebrow">None Shall Perish / Collection</div><h1 class="title" id="name">NSP Collection 01</h1><div class="price" id="price">₱490.00</div><div class="label">Size</div><div class="sizes"><button class="size active">M</button><button class="size">L</button><button class="size">XL</button><button class="size">XXL</button></div><div class="label">Quantity</div><input class="quantity" id="qty" type="number" min="1" value="1"><button class="add" id="add">Add to Bag</button><div class="notice" id="notice"></div><div class="tabs"><span class="tab">Details</span><span class="tab">Sizing</span><span class="tab">Returns</span></div><p class="copy">A limited NSP piece designed to carry your faith with you. Made for everyday wear, movement, and life beyond the walls of the church.</p><a class="back" href="/collection.html">← Back to Collection</a></section></main>
<script>
const products={1:{name:'NSP Collection 01',price:490,image:'/1.png'},2:{name:'NSP Collection 02',price:490,image:'/2.png'},3:{name:'NSP Collection 03',price:490,image:'/3.png'},4:{name:'NSP Collection 04',price:490,image:'/4.png'},5:{name:'NSP Collection 05',price:490,image:'/5.png'},6:{name:'NSP Collection 06',price:490,image:'/6.png'},7:{name:'NSP Collection 07',price:490,image:'/7.png'}};
const id=Number(new URLSearchParams(location.search).get('product'))||1;const p=products[id]||products[1];document.getElementById('photo').src=p.image;document.getElementById('photo').alt=p.name;document.getElementById('name').textContent=p.name;document.getElementById('price').textContent='₱'+p.price.toFixed(2);document.title='NSP — '+p.name;
document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{document.querySelectorAll('.size').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
function updateCount(){document.getElementById('count').textContent=JSON.parse(localStorage.getItem('nspBag')||'[]').length}updateCount();window.addEventListener('storage',updateCount);
document.getElementById('add').onclick=()=>{const bag=JSON.parse(localStorage.getItem('nspBag')||'[]');const size=document.querySelector('.size.active').textContent;const qty=Math.max(1,Number(document.getElementById('qty').value)||1);for(let i=0;i<qty;i++)bag.push({name:p.name,price:p.price,image:p.image,size});localStorage.setItem('nspBag',JSON.stringify(bag));updateCount();document.getElementById('notice').textContent='Added to your bag.';};
const drawer=document.getElementById('drawer');document.getElementById('menu').onclick=()=>drawer.classList.add('open');document.getElementById('drawerClose').onclick=()=>drawer.classList.remove('open');
</script>
</body>
</html>
