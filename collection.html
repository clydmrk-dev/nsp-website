<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NSP — Collection</title>
<link rel="icon" type="image/png" href="/logonspfinal.png">
<style>
:root{--forest:#123B2A;--cream:#F4F1E8;--black:#0A0A0A}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--black);overflow-x:hidden}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.header{height:105px;padding:0 5%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;position:sticky;top:0;z-index:10;background:#fff}
.menu{justify-self:start;border:0;background:none;width:34px;height:34px;display:flex;flex-direction:column;justify-content:center;gap:5px}.menu span{display:block;width:28px;height:2px;background:#111}
.logo-link{display:flex;align-items:center;justify-content:center;width:360px;height:120px}.logo{width:360px;height:120px;object-fit:contain}
.bag{justify-self:end;border:0;background:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;position:relative}.bag svg{width:25px;height:25px;stroke:#111;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.count{position:absolute;right:-3px;top:-2px;min-width:15px;height:15px;border-radius:50%;background:var(--forest);color:var(--cream);font-size:8px;display:flex;align-items:center;justify-content:center}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(360px,82vw);background:var(--forest);color:var(--cream);z-index:30;transform:translateX(-100%);transition:transform .3s;padding:105px 28px}.drawer.open{transform:translateX(0)}.drawer a{display:block;padding:17px 18px;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.drawer a:hover{background:var(--cream);color:var(--forest)}.drawer-close{position:absolute;right:22px;top:25px;border:0;background:none;color:var(--cream);font-size:25px}
.main{padding:55px 5% 100px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:55px;gap:30px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;opacity:.45;margin-bottom:12px}.title{font-size:clamp(52px,8vw,105px);line-height:.8;letter-spacing:-.075em;color:var(--forest);text-transform:uppercase}.sub{max-width:320px;font-size:12px;line-height:1.6;opacity:.55}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:70px 28px}.product{cursor:pointer}.image{width:100%;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}.image img{width:100%;height:100%;object-fit:contain;transition:transform .45s}.product:hover .image img{transform:scale(1.035)}.info{padding-top:15px;display:flex;justify-content:center;gap:14px;align-items:baseline;text-align:center}.name,.price{font-size:18px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}.price{font-weight:500;white-space:nowrap}.price:before{content:'— ';}
@media(max-width:800px){.header{height:85px}.logo-link,.logo{width:240px;height:85px}.main{padding-top:35px}.intro{display:block}.sub{margin-top:22px}.grid{grid-template-columns:repeat(2,1fr);gap:45px 14px}.name,.price{font-size:18px}.info{display:flex;justify-content:center;gap:10px;align-items:baseline;text-align:center}.price:before{content:'— ';}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.image{aspect-ratio:1/1.1}}
</style>
</head>
<body>
<header class="header">
<button class="menu" id="menu" aria-label="Open menu"><span></span><span></span><span></span></button>
<a class="logo-link" href="/" aria-label="NSP Home"><img class="logo" src="/logonspfinal.png" alt="None Shall Perish"></a>
<a class="bag" href="/cart.html" aria-label="Shopping bag"><svg viewBox="0 0 24 24"><path d="M5 8.5h14l-1 11H6l-1-11Z"></path><path d="M8.5 8.5V6.75a3.5 3.5 0 0 1 7 0V8.5"></path></svg><span class="count" id="count">0</span></a>
</header>
<nav class="drawer" id="drawer"><button class="drawer-close" id="drawerClose">×</button><a href="/">Home</a><a href="/collection.html">Shop</a><a href="/#about">About</a><a href="/#contact">Contact</a><a href="/cart.html">Cart</a></nav>
<main class="main">
<section class="intro"><div><div class="eyebrow">None Shall Perish</div><h1 class="title">The Collection</h1></div><p class="sub">Christian streetwear made to carry faith beyond the walls of the church.</p></section>
<section class="grid" aria-label="NSP shirt collection">
<a class="product" href="/product.html?product=1"><div class="image"><img src="/1.png" alt="NSP Collection 01"></div><div class="info"><span class="name">NSP Collection 01</span><span class="price">₱490</span></div></a>
<a class="product" href="/product.html?product=2"><div class="image"><img src="/2.png" alt="NSP Collection 02"></div><div class="info"><span class="name">NSP Collection 02</span><span class="price">₱490</span></div></a>
<a class="product" href="/product.html?product=4"><div class="image"><img src="/4.png" alt="NSP Collection 04"></div><div class="info"><span class="name">NSP Collection 04</span><span class="price">₱490</span></div></a>
<a class="product" href="/product.html?product=6"><div class="image"><img src="/6.png" alt="NSP Collection 06"></div><div class="info"><span class="name">NSP Collection 06</span><span class="price">₱490</span></div></a>
</section>
</main>
<script>
const drawer=document.getElementById('drawer');document.getElementById('menu').onclick=()=>drawer.classList.add('open');document.getElementById('drawerClose').onclick=()=>drawer.classList.remove('open');
function updateCount(){const bag=JSON.parse(localStorage.getItem('nspBag')||'[]');document.getElementById('count').textContent=bag.length}updateCount();window.addEventListener('storage',updateCount);
</script>
</body>
</html>
